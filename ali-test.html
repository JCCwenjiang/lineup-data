<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿里云统计连接测试</title><style>body{background:#101613;color:#edf4ef;font:17px system-ui;max-width:650px;margin:30px auto;padding:20px}button,select{font:inherit;padding:12px;margin:8px 0;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;word-break:break-word;background:#19221d;padding:16px}</style><h1>热门统计测试</h1><p>仅用于测试，记录与原来的热门榜单分开。两台手机选择同一阵容，成功复制后应合计 2；同一手机重复复制不增加。</p><select id="lineup"></select><button id="health">1. 检查连接</button><button id="copy">2. 复制阵容并上报</button><button id="rank">3. 查看共享榜单</button><pre id="out">正在读取现有阵容……</pre><script src="ali-stats-config.js"></script><script src="ali-stats.js"></script><script>
let rows=[];const out=document.getElementById('out'),sel=document.getElementById('lineup');
const show=x=>out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
fetch('./lineups.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('阵容读取失败');return r.json()}).then(d=>{rows=d.rows.filter(x=>x.n&&x.code&&!x.banned&&!x.pending);rows.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.n;sel.appendChild(o)});show('已就绪，请先检查连接。')}).catch(e=>show(e.message));
document.getElementById('health').onclick=async()=>{show('连接中……');const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(WENJIANG_STATS_URL+'/health',{signal:c.signal,cache:'no-store'});show(await r.json())}catch(e){show('连接失败：'+e.message)}finally{clearTimeout(t)}};
document.getElementById('copy').onclick=async()=>{const d=rows[+sel.value];if(!d)return;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(d.code)}else{const t=document.createElement('textarea');t.value=d.code;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('复制失败，未上报')}show('已复制，正在上报……');const ok=await WenjiangStats.record(d);show(ok?'上报成功。同一手机重复复制不会增加人数。':WenjiangStats.status.copy)}catch(e){show(e.message)}};
document.getElementById('rank').onclick=async()=>{const d=rows[+sel.value];if(!d)return;const s=d.season||(d.cat==='s11'?'s11':d.cat==='s165'?'s165':'s18');show('读取中……');try{show(await WenjiangStats.rank(s))}catch(e){show(e.message)}};
</script></html>
